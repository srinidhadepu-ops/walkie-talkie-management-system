<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Walkie-Talkie Management</title><style>body{font:16px system-ui;margin:0;background:#f4f7fb;color:#172033}header{background:#102a43;color:white;padding:18px}main{max-width:1000px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.card,form{background:white;border-radius:10px;padding:16px;box-shadow:0 1px 4px #ccd}input,select,button{padding:10px;margin:5px 0;width:100%;box-sizing:border-box}button{background:#176b87;color:#fff;border:0;border-radius:6px;font-weight:600;cursor:pointer}.hidden{display:none}#notice{padding:10px;border-radius:6px;margin:10px 0;background:#e7f5ec}table{width:100%;border-collapse:collapse;background:white}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><header><h1>Walkie-Talkie Management System</h1><span id="who">Sign in to begin</span></header><main><section id="login" class="card"><h2>Sign in</h2><p>Demo operator: <code>operator / ChangeMe123!</code></p><input id="username" value="operator" placeholder="Username"><input id="password" type="password" value="ChangeMe123!" placeholder="Password"><button onclick="login()">Sign in</button></section><section id="app" class="hidden"><div id="notice">Ready.</div><p><button onclick="startShift()">Start shift</button></p><h2>Live dashboard</h2><div id="states" class="grid"></div><div class="grid"><form onsubmit="issue(event)"><h2>Issue device</h2><select id="device"></select><select id="employee"></select><button>Confirm issue</button></form><form onsubmit="returnQr(event)"><h2>Normal return</h2><select id="returnDevice"></select><button>Confirm QR return</button></form><form onsubmit="charge(event)"><h2>Start charging</h2><select id="chargeDevice"></select><input id="charger" value="CH-01"><button>Start charging</button></form></div><h2>Active issues</h2><table><thead><tr><th>Asset</th><th>Employee</th><th>Issued</th></tr></thead><tbody id="issues"></tbody></table></section></main><script src="app.js"></script></body></html>
